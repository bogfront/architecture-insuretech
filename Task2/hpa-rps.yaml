# HPA на основе кастомной метрики RPS из Prometheus через prometheus-adapter.
# Требует установки:
#   1. kube-prometheus-stack (Prometheus + Prometheus Operator)
#   2. prometheus-adapter с конфигурацией для метрики http_requests_total
#
# Конфигурация prometheus-adapter (custom-metrics-config):
#   rules:
#   - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
#     resources:
#       overrides:
#         namespace: {resource: "namespace"}
#         pod: {resource: "pod"}
#     name:
#       matches: "^(.*)_total$"
#       as: "${1}_per_second"
#     metricsQuery: 'rate(http_requests_total{<<.LabelMatchers>>}[2m])'
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-app-hpa-rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          # Масштабировать, если среднее RPS на под превышает 10
          averageValue: "10"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
